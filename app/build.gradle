plugins { id 'com.android.application' }

android {
    namespace 'com.jilani.mobcam'
    compileSdk 34
    defaultConfig {
        applicationId "com.jilani.mobcam"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        mobcam {
            storeFile file('mobcam.jks')
            storePassword 'mobcam123'
            keyAlias 'mobcam'
            keyPassword 'mobcam123'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.mobcam }
        debug { signingConfig signingConfigs.mobcam }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'com.herohan:UVCAndroid:1.0.13'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
